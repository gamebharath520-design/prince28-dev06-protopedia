[project]
name = "protopedia"
version = "0.1.0"
description = "Answers 'what does the RFC actually say' for core internet protocols"
readme = "README.md"
authors = [
    { name = "bharathraj", email = "gamebharath520@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]



[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Harmless notice from newer Starlette versions; hide it so real warnings stand out.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
